<!doctype html>
<!--
  The Open Graph card template (1200 x 630). tools/og/build.mjs serves public/ and this folder from a local server,
  fills the slots for one card at a time and screenshots .og. It uses the site's own tokens and fonts (site.css); the
  og- rules below are for these cards only. Text sizes are chosen to stay legible at a 400 px thumbnail.
-->
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Open Graph card</title>
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  html, body { margin: 0; background: #090C10; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    --pad: 64px;
    position: relative; isolation: isolate; width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    color-scheme: dark; background: var(--bg); color: var(--text); font-family: var(--font-sans);
  }
  .og::before {
    content: ""; position: absolute; inset: 0; z-index: -2;
    background-image: linear-gradient(rgb(232 236 241 / 0.05) 1px, transparent 1px), linear-gradient(90deg, rgb(232 236 241 / 0.05) 1px, transparent 1px);
    background-size: 48px 48px; background-position: -1px -1px; mask-image: linear-gradient(to bottom, #000 20%, transparent 92%);
  }
  .og[data-product]::after {
    content: ""; position: absolute; z-index: -1; right: -12%; top: -18%; width: 78%; height: 150%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 18%, transparent), transparent 74%);
  }
  .og-topbar { position: absolute; inset: 0 0 auto; height: 8px; background: var(--accent); }
  .og:not([data-product]) .og-topbar { display: none; }

  .og-head { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 46px var(--pad) 0; }
  .og-brand { display: flex; align-items: center; gap: 18px; font: 720 31px/1 var(--font-display); font-stretch: 118%; letter-spacing: -0.02em; white-space: nowrap; }
  .og-brand span { font-weight: 420; color: var(--text-2); }
  .og-mark { width: 56px; height: 44px; flex: none;
    background: linear-gradient(90deg, var(--text) 0 18px, transparent 0) 0 100% / 100% 10px no-repeat,
      linear-gradient(var(--bg), var(--bg)) 0 100% / 100% 12px no-repeat, var(--bars); }
  .og-url { font: 560 22px/1 var(--font-sans); font-stretch: 106%; color: var(--text-2); letter-spacing: 0.005em; }

  .og-body { display: grid; grid-template-columns: minmax(0, 1fr) 452px; gap: 60px; align-items: center; padding: 0 var(--pad); min-height: 0; }
  .og--wide .og-body { grid-template-columns: minmax(0, 1fr) 500px; gap: 48px; }
  .og-nb { white-space: nowrap; }
  .og-text { min-width: 0; }
  .og-tag { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; font: 700 34px/1 var(--font-display); font-stretch: 116%; letter-spacing: -0.015em; }
  .og-tag .c-swatch { width: 22px; height: 22px; border-radius: 2px; }
  .og-role { display: inline-flex; align-items: center; height: 34px; padding: 0 11px; border-radius: 3px; background: var(--accent); color: var(--on-lamp); font: 700 19px/1 var(--font-mono); letter-spacing: 0.02em; }
  .og-flag { display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 3px; box-shadow: inset 0 0 0 2px var(--accent-line); font: 650 19px/1 var(--font-sans); font-stretch: 106%; letter-spacing: 0; color: var(--text); }
  .og-eyebrow { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; font: 620 25px/1.1 var(--font-sans); font-stretch: 106%; color: var(--text-2); }
  .og-eyebrow::before { content: ""; width: 30px; height: 15px; flex: none; background: var(--apps); }
  .og-title { font: 700 66px/1.02 var(--font-display); font-stretch: 112%; letter-spacing: -0.032em; text-wrap: balance; }
  .og-sub { margin-top: 24px; max-width: 30ch; font-size: 27px; line-height: 1.32; color: var(--text-2); text-wrap: pretty; }
  .og-sub:empty { display: none; }
  .og-bars { height: 14px; background: var(--bars); }
  .og-visual { min-width: 0; }

  /* A monitor with its under-monitor display (the drawn screens are the kitchen sink's). */
  .og-monitor { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid #262D37; border-bottom: 0; background: #05070A; }
  .og-monitor > svg { width: 100%; height: 100%; }
  .og-umd { display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 16px 0 0; background: #000; border: 1px solid #262D37; border-top-color: #1C222B; color: #E8ECF1; }
  .og-umd b { font: 650 23px/1 var(--font-display); font-stretch: 112%; }
  .og-umd i { width: 6px; align-self: stretch; background: var(--accent); }
  .og-umd em { margin-left: auto; font: 650 18px/1 var(--font-mono); font-style: normal; letter-spacing: 0.04em; color: var(--accent); }
  .og-umd .c-tally { height: 26px; min-width: 52px; font-size: 13px; margin-left: 12px; }

  /* Home: the multiview. */
  .og-mv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; background: #262D37; }
  .og-mv-tile { background: #000; }
  .og-mv-tile svg { display: block; width: 100%; aspect-ratio: 16 / 10; }
  .og-mv-umd { display: flex; align-items: center; gap: 10px; height: 36px; padding-right: 12px; border-top: 1px solid #1C222B; }
  .og-mv-umd i { width: 5px; align-self: stretch; background: var(--accent); }
  .og-mv-umd b { font: 650 18px/1 var(--font-display); font-stretch: 112%; color: #E8ECF1; }
  .og-mv-umd em { margin-left: auto; font: 650 14px/1 var(--font-mono); font-style: normal; color: var(--accent); }

  /* Rows: a router panel of the four apps, a download list, an integration list. */
  .og-rows { display: grid; gap: 2px; padding: 2px; border-radius: 8px; background: var(--line); }
  .og-row { display: flex; align-items: center; gap: 16px; min-height: 76px; padding: 0 22px 0 0; background: var(--s1); }
  .og-row:first-child { border-radius: 6px 6px 0 0; } .og-row:last-child { border-radius: 0 0 6px 6px; }
  .og-row > i { width: 6px; align-self: stretch; background: var(--accent); }
  .og-row b { font: 680 25px/1.1 var(--font-display); font-stretch: 112%; }
  .og-row--app { padding: 14px 20px 14px 0; }
  .og-row-main { display: grid; gap: 6px; flex: 1; min-width: 0; }
  .og-row-top { display: flex; align-items: center; gap: 12px; }
  .og-row--app small { margin-top: 0; font-size: 18px; }
  .og-row small { display: block; margin-top: 5px; font-size: 17px; color: var(--text-2); font-stretch: 100%; font-weight: 400; font-family: var(--font-sans); }
  .og-row .og-role { margin-left: auto; height: 30px; font-size: 16px; }
  .og-row--icon { padding-left: 22px; min-height: 68px; }
  .og-row--icon .c-icon { width: 30px; height: 30px; color: var(--text-2); stroke-width: 1.5; }
  .og-row--icon b { font: 600 23px/1.15 var(--font-sans); font-stretch: 106%; }

  .og-chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .og-chip { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 14px 8px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--s1); font: 600 20px/1.15 var(--font-sans); font-stretch: 106%; }
  .og-chip span { display: grid; place-items: center; min-width: 54px; height: 46px; padding: 0 6px; border-radius: 3px; background: var(--s3); font: 700 16px/1 var(--font-mono); letter-spacing: 0.03em; }

  /* AI: the proposal reaches only the amber gate. */
  .og-flow { display: grid; gap: 0; justify-items: stretch; }
  .og-node { display: grid; gap: 6px; padding: 18px 22px; border: 1.5px solid var(--line-2); border-radius: 6px; background: var(--s1); }
  .og-node b { display: flex; align-items: center; gap: 12px; font: 680 26px/1.1 var(--font-display); font-stretch: 110%; }
  .og-node small { font-size: 19px; color: var(--text-2); }
  .og-node--ai { border-style: dashed; }
  .og-node--gate { border: 2px dashed var(--ink-standby); background: color-mix(in srgb, var(--lamp-standby) 10%, var(--s1)); }
  .og-node--gate .c-icon { width: 30px; height: 30px; }
  .og-node--gate em { display: flex; align-items: center; gap: 10px; margin-top: 4px; font: 650 18px/1 var(--font-sans); font-style: normal; color: var(--ink-standby); }
  .og-node--gate .c-lamp { width: 11px; height: 11px; }
  .og-wire { display: flex; align-items: center; gap: 14px; height: 54px; padding-left: 40px; font: 650 15px/1 var(--font-mono); letter-spacing: 0.06em; color: var(--ink-standby); }
  .og-wire::before { content: ""; align-self: stretch; border-left: 3px dashed currentColor; }
  .og-wire--plain { color: var(--text-3); }
  .og-wire--plain { height: 40px; }
  .og-wire--plain::before { border-left-style: solid; border-left-width: 2px; border-left-color: var(--text-3); }

  /* Ecosystem: four apps on one bus. */
  .og-bus { display: grid; grid-template-columns: minmax(0, 1fr) 54px; column-gap: 34px; align-items: stretch; }
  .og-bus-apps { display: grid; gap: 12px; }
  .og-bus-app { position: relative; display: flex; align-items: center; gap: 14px; height: 70px; padding: 0 18px; border: 1px solid var(--line-2); border-left: 5px solid var(--accent); border-radius: 6px; background: var(--s1); }
  .og-bus-app b { font: 680 25px/1 var(--font-display); font-stretch: 112%; }
  .og-bus-app em { margin-left: auto; font: 650 16px/1 var(--font-mono); font-style: normal; color: var(--accent-ink); }
  .og-bus-app::after { content: ""; position: absolute; left: 100%; top: 50%; width: 35px; height: 3px; background: var(--accent); }
  .og-bus-line { position: relative; display: grid; place-items: center; border: 1.5px solid var(--text-2); border-radius: 6px; background: var(--s2); overflow: hidden; }
  .og-bus-line::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: linear-gradient(var(--c-patterns) 0 25%, var(--c-stagewatch) 0 50%, var(--c-agmessage) 0 75%, var(--c-playmap) 0); }
  .og-bus-line b { writing-mode: vertical-rl; rotate: 180deg; font: 700 22px/1 var(--font-display); font-stretch: 116%; }
  .og-note { margin-top: 18px; font-size: 19px; color: var(--text-2); }

  /* Cue list (workflows). */
  .og-cues { border: 1px solid var(--line); border-radius: 8px; background: var(--s1); overflow: hidden; }
  .og-cue { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; align-items: center; gap: 14px; height: 60px; padding: 0 18px; border-bottom: 1px solid var(--line); }
  .og-cue:last-child { border-bottom: 0; }
  .og-cue span { font: 700 21px/1 var(--font-mono); color: var(--text-2); }
  .og-cue b { font: 600 21px/1.1 var(--font-sans); font-stretch: 106%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .og-cue i { display: flex; gap: 5px; }
  .og-cue i .c-swatch { width: 13px; height: 13px; }

  /* Pricing (StageWatch licences): three tiers. */
  .og-tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
  .og-tier { position: relative; display: grid; align-content: start; gap: 10px; padding: 26px 16px 18px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--s1); }
  .og-tier.is-rec { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--s1)); box-shadow: inset 0 5px 0 var(--accent); }
  .og-tier h3 { font: 680 22px/1.1 var(--font-display); font-stretch: 110%; }
  .og-tier p { font: 720 48px/1 var(--font-display); font-stretch: 112%; letter-spacing: -0.03em; font-variant-numeric: lining-nums tabular-nums; }
  .og-tier small { font-size: 16px; line-height: 1.3; color: var(--text-2); }
  .og-tier .og-flagline { position: absolute; top: -15px; left: 12px; padding: 5px 9px; border-radius: 3px; background: var(--accent); color: var(--on-lamp); font: 700 15px/1 var(--font-sans); font-stretch: 106%; white-space: nowrap; }

  /* A licence file, a fact sheet. */
  .og-sheet { border: 1px solid var(--line-2); border-radius: 8px; background: var(--s1); overflow: hidden; }
  .og-sheet-head { display: flex; align-items: center; gap: 14px; padding: 18px 22px; border-bottom: 1px solid var(--line-2); background: var(--s2); font: 680 25px/1 var(--font-display); font-stretch: 112%; }
  .og-sheet-head .c-icon { width: 30px; height: 30px; }
  .og-sheet dl { display: grid; grid-template-columns: auto minmax(0, 1fr); margin: 0; }
  .og-sheet dt, .og-sheet dd { margin: 0; padding: 15px 22px; border-bottom: 1px solid var(--line); font-size: 20px; line-height: 1.25; }
  .og-sheet dt { color: var(--text-3); font-weight: 560; padding-right: 8px; }
  .og-sheet dd { font-weight: 600; font-stretch: 106%; }
  .og-sheet dl > :nth-last-child(-n+2) { border-bottom: 0; }

  /* The assistant, the contact form. */
  .og-chat { border: 1px solid var(--line-2); border-radius: 8px; background: var(--s1); overflow: hidden; }
  .og-chat-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--s2); font: 680 24px/1 var(--font-display); font-stretch: 110%; }
  .og-chat-head em { display: inline-flex; align-items: center; gap: 9px; margin-left: auto; font: 500 17px/1 var(--font-sans); font-style: normal; color: var(--text-2); }
  .og-chat-scope { display: flex; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); font-size: 18px; line-height: 1.35; color: var(--text-2); }
  .og-chat-scope b { color: var(--text); font-weight: 620; }
  .og-chat-scope .c-icon { width: 22px; height: 22px; margin-top: 1px; }
  .og-chat-chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 18px 20px 22px; }
  .og-chat-chips span { padding: 9px 16px; border: 1.5px solid var(--field); border-radius: 999px; font: 600 18px/1 var(--font-sans); }
  .og-radios { display: grid; gap: 10px; }
  .og-radio { display: flex; align-items: center; gap: 16px; min-height: 62px; padding: 0 20px; border: 1.5px solid var(--field); border-radius: 6px; background: var(--s1); font: 580 21px/1.15 var(--font-sans); font-stretch: 104%; }
  .og-radio::before { content: ""; width: 20px; height: 20px; flex: none; border: 2px solid var(--text-3); border-radius: 50%; }
  .og-radio.is-on { border-color: var(--text); background: var(--s2); box-shadow: inset 0 0 0 1px var(--text); }
  .og-radio.is-on::before { border: 6px solid var(--text); }
</style>
</head>
<body>
<div class="og" data-og>
  <span class="og-topbar"></span>
  <header class="og-head">
    <span class="og-brand"><span class="og-mark"></span>Patterns <span>Show Control</span></span>
    <span class="og-url">patternsshowcontrol.co.uk</span>
  </header>
  <main class="og-body">
    <div class="og-text">
      <p class="og-tag" data-slot="tag" hidden><i class="c-swatch"></i><span data-slot="name"></span><span class="og-role" data-slot="role"></span><span class="og-flag" data-slot="flag" hidden></span></p>
      <p class="og-eyebrow" data-slot="eyebrow" hidden></p>
      <h1 class="og-title" data-slot="title"></h1>
      <p class="og-sub" data-slot="sub"></p>
    </div>
    <div class="og-visual" data-slot="visual"></div>
  </main>
  <span class="og-bars"></span>
</div>

  <polygon points="272,50 300,66 306,164 280,156" fill="#11172A" stroke="#7F98FF" stroke-opacity=".7" stroke-width=".8"/>
